name: News_Hub RSS Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/20 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News_Hub scanner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ONCE: "1"
          TIME_BUDGET: "1100"
        run: |
          python scraper.py
